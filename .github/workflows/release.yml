name: Release PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - closed

permissions:
  contents: read

jobs:
  validate:
    if: github.event.action != 'closed' && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev] build

      - name: Validate branch shape
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          python scripts/ci/validate_pr_branch.py \
            --base-ref "$GITHUB_BASE_REF" \
            --expected-base "main" \
            --head-ref "$GITHUB_HEAD_REF" \
            --head-prefix "release/"

      - name: Validate release metadata
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          python scripts/ci/validate_release_pr.py \
            --base-ref "$GITHUB_BASE_REF" \
            --expected-base "main" \
            --head-ref "$GITHUB_HEAD_REF"

      - name: Run ruff
        run: python -m ruff check packages/skiller/src apps/tui/src packages/skiller/tests apps/tui/tests

      - name: Run pytest
        run: python -m pytest

      - name: Build package
        run: python -m build

  create_tag:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Create or verify release tag
        id: tag
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          release_tag="v${RELEASE_BRANCH#release/}"
          if git show-ref --verify --quiet "refs/tags/$release_tag"; then
            tag_commit="$(git rev-parse "refs/tags/$release_tag^{commit}")"
            if [[ "$tag_commit" != "$MERGE_COMMIT_SHA" ]]; then
              echo "Release tag points to a different commit: $release_tag" >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$release_tag" "$MERGE_COMMIT_SHA"
          fi
          git push origin "refs/tags/$release_tag"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Request PyPI publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run publish.yml --ref main --field "tag=$RELEASE_TAG"
          echo "Publication requested for $RELEASE_TAG; completion is tracked in [Publish to PyPI](https://github.com/$GH_REPO/actions/workflows/publish.yml)." >> "$GITHUB_STEP_SUMMARY"
