name: auths/auth
description: "Choose the initial LLM provider setup flow"
version: "0.1"
start: show_menu

inputs:
  continue_id: string

steps:
  - notify: show_menu
    format: markdown
    message: |
      # Configure an LLM provider

      To work with agents, configure an LLM provider first.

      Choose an option:

      ```text
      1 Codex
      2 MiniMax
      3 Bedrock
      4 LM Studio
      5 Configure later
      6 Exit
      ```
    next: select_provider

  - wait_input: select_provider
    prompt: "Choose 1, 2, 3, 4, 5, or 6."
    next: route_provider

  - switch: route_provider
    value: '{{output_value("select_provider").payload.text}}'
    cases:
      "1": start_codex
      "2": start_minimax
      "3": start_bedrock
      "4": start_lmstudio
      "5": configure_later
      "6": exit_app
    default: invalid_choice

  - notify: start_codex
    format: markdown
    message: Starting Codex setup.
    action:
      type: run
      label: Start Codex setup
      arg: auths/codex
      params: "--arg continue_id={{inputs.continue_id}}"
      auto: true

  - notify: start_minimax
    format: markdown
    message: Starting MiniMax setup.
    action:
      type: run
      label: Start MiniMax setup
      arg: auths/minimax
      params: "--arg continue_id={{inputs.continue_id}}"
      auto: true

  - notify: start_bedrock
    format: markdown
    message: Starting Bedrock setup.
    action:
      type: run
      label: Start Bedrock setup
      arg: auths/bedrock
      params: "--arg continue_id={{inputs.continue_id}}"
      auto: true

  - notify: start_lmstudio
    format: markdown
    message: Starting LM Studio setup.
    action:
      type: run
      label: Start LM Studio setup
      arg: auths/lmstudio
      params: "--arg continue_id={{inputs.continue_id}}"
      auto: true

  - notify: configure_later
    format: markdown
    message: |
      You can configure an LLM provider later.

      In Stui:

      ```text
      /auth
      ```

      Or directly with the Skiller CLI as:

      ```text
      skiller run auths/auth
      ```

  - notify: exit_app
    format: markdown
    message: |
      Use `/` to see more commands.

  - notify: invalid_choice
    format: markdown
    message: |
      Invalid option. Choose `1`, `2`, `3`, `4`, `5`, or `6`.
    next: select_provider
