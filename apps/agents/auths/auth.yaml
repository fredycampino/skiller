name: auths/auth
description: "Choose the initial LLM provider setup flow"
version: "0.1"
start: show_menu

inputs:
  continue_id: string

steps:
  - notify: show_menu
    format: markdown
    message: |
      # Configure an LLM provider

      To work with agents, configure an LLM provider first.

      Choose an option:

      ```text
      1 Codex
      2 Bedrock
      3 Ollama
      4 LM Studio
      5 OpenRouter
      6 DeepSeek
      7 Moonshot
      8 MiniMax
      9 Configure later
      ```
    next: select_provider

  - wait_input: select_provider
    prompt: "Choose 1, 2, 3, 4, 5, 6, 7, 8, or 9."
    next: route_provider

  - switch: route_provider
    value: '{{output_value("select_provider").payload.text}}'
    cases:
      "1": start_codex
      "2": start_bedrock
      "3": start_ollama
      "4": start_lmstudio
      "5": start_openrouter
      "6": start_deepseek
      "7": start_moonshot
      "8": start_minimax
      "9": configure_later
    default: invalid_choice

  - notify: start_codex
    format: markdown
    message: Starting Codex setup.
    action:
      type: run
      label: Start Codex setup
      arg: auths/codex
      params: "--arg continue_id={{inputs.continue_id}}"
      auto: true

  - notify: start_minimax
    format: markdown
    message: Starting MiniMax setup.
    action:
      type: run
      label: Start MiniMax setup
      arg: auths/openai
      params: "--arg provider=minimax --arg continue_id={{inputs.continue_id}}"
      auto: true

  - notify: start_bedrock
    format: markdown
    message: Starting Bedrock setup.
    action:
      type: run
      label: Start Bedrock setup
      arg: auths/bedrock
      params: "--arg continue_id={{inputs.continue_id}}"
      auto: true

  - notify: start_lmstudio
    format: markdown
    message: Starting LM Studio setup.
    action:
      type: run
      label: Start LM Studio setup
      arg: auths/lmstudio
      params: "--arg continue_id={{inputs.continue_id}}"
      auto: true

  - notify: start_moonshot
    format: markdown
    message: Starting Moonshot setup.
    action:
      type: run
      label: Start Moonshot setup
      arg: auths/moonshot
      params: "--arg continue_id={{inputs.continue_id}}"
      auto: true

  - notify: start_deepseek
    format: markdown
    message: Starting DeepSeek setup.
    action:
      type: run
      label: Start DeepSeek setup
      arg: auths/openai
      params: "--arg provider=deepseek --arg continue_id={{inputs.continue_id}}"
      auto: true

  - notify: start_ollama
    format: markdown
    message: Starting Ollama setup.
    action:
      type: run
      label: Start Ollama setup
      arg: auths/ollama
      params: "--arg continue_id={{inputs.continue_id}}"
      auto: true

  - notify: start_openrouter
    format: markdown
    message: Starting OpenRouter setup.
    action:
      type: run
      label: Start OpenRouter setup
      arg: auths/openai
      params: "--arg provider=openrouter --arg continue_id={{inputs.continue_id}}"
      auto: true

  - notify: configure_later
    format: markdown
    message: |
      You can configure an LLM provider later.

      In Stui:

      ```text
      /auth
      ```

      Or directly with the Skiller CLI as:

      ```text
      skiller run auths/auth
      ```

  - notify: invalid_choice
    format: markdown
    message: |
      Invalid option. Choose `1`, `2`, `3`, `4`, `5`, `6`, `7`, `8`, or `9`.
    next: select_provider
