name: auths/codex
description: "Authorize OpenAI Codex credentials for Skiller agents"
version: "0.1"
start: check_codex_credentials

inputs:
  continue_id: string

on_success:
  cleanup: true
  action:
    type: post
    label: Auth success
    arg: load_session
    params: "run_id={{inputs.continue_id}}"
    auto: true

on_error:
  cleanup: true

steps:
  - shell: check_codex_credentials
    allowed_paths:
      - "~/.skiller"
    command: |
      set -eu

      if verify_output="$({{runtime.python}} "{{flow.dir}}/codex_auth.py" verify --model "gpt-5.5" 2>&1)"; then
        printf '%s' ready
        exit 0
      fi

      {{runtime.python}} "{{flow.dir}}/codex_auth.py" cleanup-authorization
      printf '%s' missing
    cwd: .
    timeout: 15
    check: true
    next: route_codex_credentials

  - switch: route_codex_credentials
    value: '{{output_value("check_codex_credentials").stdout}}'
    cases:
      ready: require_credentials
    default: explain_authorization

  - notify: explain_authorization
    format: markdown
    message: |
      # Codex setup

      This flow will authorize OpenAI Codex and save credentials in the configured
      Codex credentials file.

      If no file is configured, Skiller uses:

      ```text
      ~/.skiller/secrets/openai-codex.json
      ```

      The setup run will clean its persisted context after it finishes.
    next: prepare_authorization

  - shell: prepare_authorization
    allowed_paths:
      - "~/.skiller"
    command: |-
      "{{runtime.python}}" "{{flow.dir}}/codex_auth.py" prepare
    cwd: .
    timeout: 15
    check: true
    next: start_callback_server

  - shell: start_callback_server
    allowed_paths:
      - "~/.skiller"
    command: |-
      "{{runtime.python}}" "{{flow.dir}}/codex_auth.py" start-callback-server
    cwd: .
    timeout: 15
    check: true
    next: open_authorization_url

  - notify: open_authorization_url
    format: markdown
    message: Authorize OpenAI Codex in your browser.
    action:
      type: open_url
      label: Open OpenAI authorization
      url: '{{output_value("prepare_authorization").stdout}}'
      auto: true
    next: wait_authorization_callback

  - shell: wait_authorization_callback
    allowed_paths:
      - "~/.skiller"
    command: |-
      "{{runtime.python}}" "{{flow.dir}}/codex_auth.py" wait-callback
    cwd: .
    timeout: 960
    check: true
    next: exchange_authorization_code

  - shell: exchange_authorization_code
    allowed_paths:
      - "~/.skiller"
    command: |-
      "{{runtime.python}}" "{{flow.dir}}/codex_auth.py" exchange-token
    cwd: .
    timeout: 60
    check: true
    next: require_credentials

  - shell: require_credentials
    allowed_paths:
      - "~/.skiller"
    command: |-
      "{{runtime.python}}" "{{flow.dir}}/codex_auth.py" status --require
    cwd: .
    timeout: 15
    check: true
    next: verify_credentials

  - shell: verify_credentials
    allowed_paths:
      - "~/.skiller"
    command: |-
      "{{runtime.python}}" "{{flow.dir}}/codex_auth.py" verify --model "gpt-5.5"
    cwd: .
    timeout: 120
    check: true
    next: backup_codex_config

  - shell: backup_codex_config
    allowed_paths:
      - "~/.skiller"
    command: |
      set -eu

      settings_dir="$HOME/.skiller/settings"
      config_file="$settings_dir/providers.json"
      backup_file="$settings_dir/providers.json.codex-auth.bak"
      missing_file="$settings_dir/providers.json.codex-auth.missing"

      mkdir -p "$(dirname "$config_file")" "$(dirname "$backup_file")"
      rm -f "$backup_file" "$missing_file"
      if [ -f "$config_file" ]; then
        cp "$config_file" "$backup_file"
      else
        printf '%s' missing > "$missing_file"
      fi

      printf '%s' backed-up
    cwd: .
    timeout: 15
    check: true
    next: write_codex_config

  - shell: write_codex_config
    allowed_paths:
      - "~/.skiller"
    command: |
      set -eu

      settings_dir="$HOME/.skiller/settings"
      config_file="$settings_dir/providers.json"
      credentials_file="$({{runtime.python}} "{{flow.dir}}/codex_auth.py" credentials-file)"

      mkdir -p "$(dirname "$config_file")"

      CONFIG_FILE="$config_file" CREDENTIALS_FILE="$credentials_file" {{runtime.python}} - <<'PY'
      import json
      import os
      from pathlib import Path

      config_file = Path(os.environ["CONFIG_FILE"])
      credentials_file = os.environ["CREDENTIALS_FILE"]
      if config_file.exists():
          config = json.loads(config_file.read_text(encoding="utf-8"))
      else:
          config = {}
      if not isinstance(config, dict):
          raise ValueError("Provider config must contain a JSON object")

      providers = config.setdefault("providers", {})
      if not isinstance(providers, dict):
          raise ValueError("Provider config providers must contain an object")
      provider = providers.setdefault("codex", {})
      if not isinstance(provider, dict):
          raise ValueError("Codex provider config must contain an object")
      provider.pop("model", None)
      provider["timeout_seconds"] = 120
      provider["credentials_file"] = credentials_file

      config_file.write_text(
          json.dumps(config, indent=2, sort_keys=True) + "\n",
          encoding="utf-8",
      )
      PY

      printf '%s\n' "Codex provider config saved."
      printf '%s\n' "Provider config: $config_file"
      printf '%s\n' "Credentials: $credentials_file"
    cwd: .
    timeout: 15
    check: true
    next: verify_codex

  - agent: verify_codex
    system: |
      You are a configuration check agent.
      Reply with one short sentence.
    task: "Say that the Codex agent configuration works."
    tools: []
    max_turns: 1
    next: route_codex_validation

  - switch: route_codex_validation
    value: '{{output_value("verify_codex").data.stop_reason}}'
    cases:
      final: commit_codex_config
    default: restore_failed_codex_config

  - shell: commit_codex_config
    allowed_paths:
      - "~/.skiller"
    command: |
      set -eu

      settings_dir="$HOME/.skiller/settings"
      config_file="$settings_dir/agent.json"
      local_config_file="{{flow.dir}}/agent.json"

      CONFIG_FILE="$config_file" LOCAL_CONFIG_FILE="$local_config_file" {{runtime.python}} - <<'PY'
      import json
      import os
      from pathlib import Path

      config_file = Path(os.environ["CONFIG_FILE"])
      local_config_file = Path(os.environ["LOCAL_CONFIG_FILE"])
      local_config = json.loads(local_config_file.read_text(encoding="utf-8"))
      selection = local_config.get("llm")
      if not isinstance(selection, dict):
          raise ValueError("Codex auth agent config requires llm selection")

      provider = selection.get("provider")
      model = selection.get("model")
      if not isinstance(provider, str) or not provider.strip():
          raise ValueError("Codex auth agent config requires llm.provider")
      if not isinstance(model, str) or not model.strip():
          raise ValueError("Codex auth agent config requires llm.model")

      if config_file.exists():
          config = json.loads(config_file.read_text(encoding="utf-8"))
      else:
          config = {}
      if not isinstance(config, dict):
          raise ValueError("Global agent config must contain a JSON object")

      llm = config.setdefault("llm", {})
      if not isinstance(llm, dict):
          raise ValueError("Global agent config llm must contain an object")
      llm["provider"] = provider.strip()
      llm["model"] = model.strip()
      config_file.parent.mkdir(parents=True, exist_ok=True)
      config_file.write_text(
          json.dumps(config, indent=2, sort_keys=True) + "\n",
          encoding="utf-8",
      )
      PY

      rm -f "$HOME/.skiller/settings/providers.json.codex-auth.bak"
      rm -f "$HOME/.skiller/settings/providers.json.codex-auth.missing"
      printf '%s\n' "Global agent selection updated."
      printf '%s' committed
    cwd: .
    timeout: 15
    check: true
    next: credentials_ready

  - notify: credentials_ready
    format: markdown
    message: |
      Codex credentials are valid and provider configuration is ready.

      ```text
      {{output_value("verify_credentials").stdout}}
      ```

  - shell: restore_failed_codex_config
    allowed_paths:
      - "~/.skiller"
    command: |
      set -eu

      settings_dir="$HOME/.skiller/settings"
      config_file="$settings_dir/providers.json"
      backup_file="$settings_dir/providers.json.codex-auth.bak"
      missing_file="$settings_dir/providers.json.codex-auth.missing"

      if [ -f "$backup_file" ]; then
        cp "$backup_file" "$config_file"
      elif [ -f "$missing_file" ]; then
        rm -f "$config_file"
      fi

      rm -f "$backup_file" "$missing_file"
      printf '%s' restored
    cwd: .
    timeout: 15
    check: true
    next: validation_error

  - notify: validation_error
    format: markdown
    message: |
      Codex credentials are valid, but the Skiller provider configuration
      could not be validated. The credentials were kept.
