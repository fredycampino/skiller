name: auths/lmstudio
description: "Configure LM Studio settings for Skiller agents"
version: "0.1"
start: check_current_state

inputs:
  continue_id: string

on_success:
  cleanup: true
  action:
    type: post
    label: Auth success
    arg: load_session
    params: "run_id={{inputs.continue_id}}"
    auto: true

on_error:
  cleanup: true

steps:
  - shell: check_current_state
    allowed_paths:
      - "~/.skiller"
    command: |
      set -eu

      if [ "$("{{runtime.python}}" "{{flow.dir}}/lmstudio_auth.py" print-config)" = "{}" ]; then
        "{{runtime.python}}" "{{flow.dir}}/lmstudio_auth.py" write-config >/dev/null
      fi

      models_json="$("{{runtime.python}}" "{{flow.dir}}/lmstudio_auth.py" available-models 2>/dev/null || true)"
      if [ -n "$models_json" ]; then
        "{{runtime.python}}" "{{flow.dir}}/lmstudio_auth.py" add-models "$models_json" >/dev/null || true
      fi

      "{{runtime.python}}" "{{flow.dir}}/lmstudio_auth.py" format-menu
    next: show_menu

  - notify: show_menu
    format: markdown
    message: |
      {{output_value("check_current_state").stdout}}
    next: wait_selection

  - wait_input: wait_selection
    prompt: "Choose an option (1-3)"
    next: route_selection

  - switch: route_selection
    value: '{{output_value("wait_selection").payload.text}}'
    cases:
      "1": provider_status
      "2": check_connection
      "3": exit
      exit: exit
      Exit: exit
      quit: exit
      Quit: exit
    default: invalid_option

  - notify: invalid_option
    message: "Invalid option. Choose 1-3."
    next: show_menu

  - shell: provider_status
    allowed_paths:
      - "~/.skiller"
    command: |
      set -eu

      models_json="$("{{runtime.python}}" "{{flow.dir}}/lmstudio_auth.py" available-models 2>/dev/null || true)"
      if [ -n "$models_json" ]; then
        "{{runtime.python}}" "{{flow.dir}}/lmstudio_auth.py" add-models "$models_json" >/dev/null || true
      fi

      "{{runtime.python}}" "{{flow.dir}}/lmstudio_auth.py" provider-status
    next: show_provider_status

  - notify: show_provider_status
    format: markdown
    message: |
      # Provider Status

      {{output_value("provider_status").stdout}}
    next: wait_continue

  - shell: check_connection
    allowed_paths:
      - "~/.skiller"
    command: |
      set -eu

      "{{runtime.python}}" "{{flow.dir}}/lmstudio_auth.py" check-connection

      models_json="$("{{runtime.python}}" "{{flow.dir}}/lmstudio_auth.py" available-models 2>/dev/null || true)"
      if [ -n "$models_json" ]; then
        "{{runtime.python}}" "{{flow.dir}}/lmstudio_auth.py" add-models "$models_json" >/dev/null || true
      fi
    next: show_connection_result

  - notify: show_connection_result
    format: markdown
    message: |
      # Connection Check

      {{output_value("check_connection").stdout}}
    next: wait_continue


  - wait_input: wait_continue
    prompt: "Press any key to continue."
    next: check_current_state

  - notify: exit
    message: "LM Studio configuration closed."
