name: auths/ollama
description: "Configure the Ollama provider for Skiller agents"
version: "0.1"
start: explain_ollama

inputs:
  continue_id: string

on_success:
  cleanup: true
  action:
    type: post
    label: Auth success
    arg: load_session
    params: "run_id={{inputs.continue_id}}"
    auto: true

on_error:
  cleanup: true

steps:
  - shell: check_ollama_connection
    allowed_paths:
      - "~/.skiller"
    command: |
      set -eu

      base_url="http://127.0.0.1:11434"
      if {{runtime.python}} "{{flow.dir}}/ollama_auth.py" probe "$base_url" >/dev/null; then
        printf '%s' ready
      else
        printf '%s' unavailable
      fi
    cwd: .
    timeout: 15
    check: true
    next: route_ollama_connection

  - switch: route_ollama_connection
    value: '{{output_value("check_ollama_connection").stdout}}'
    cases:
      ready: backup_ollama_config_existing
    default: invalid_base_url

  - notify: explain_ollama
    format: markdown
    message: |
      # Connect to Ollama

      Start the Ollama server, download at least one model, and choose an option:

      1. Local connection at `http://127.0.0.1:11434`
      2. Use another URL
      3. Exit
    next: select_connection

  - wait_input: select_connection
    prompt: "Choose 1, 2, or 3."
    next: route_connection

  - switch: route_connection
    value: '{{output_value("select_connection").payload.text}}'
    cases:
      "1": check_ollama_connection
      "2": explain_base_url
      "3": exit_setup
    default: invalid_connection_choice

  - notify: invalid_connection_choice
    message: "Invalid option. Choose 1, 2, or 3."
    next: explain_ollama

  - notify: explain_base_url
    message: "Enter the server URL. Example: http://192.168.1.202:11434 (or type exit to cancel)."
    next: ask_base_url

  - wait_input: ask_base_url
    prompt: "Server URL, or exit."
    next: route_base_url_input

  - switch: route_base_url_input
    value: '{{output_value("ask_base_url").payload.text}}'
    cases:
      exit: exit_setup
      Exit: exit_setup
      quit: exit_setup
      Quit: exit_setup
    default: validate_custom_base_url

  - shell: validate_custom_base_url
    allowed_paths:
      - "~/.skiller"
    env:
      OLLAMA_BASE_URL: '{{output_value("ask_base_url").payload.text}}'
    command: |
      set -eu

      if {{runtime.python}} "{{flow.dir}}/ollama_auth.py" probe "$OLLAMA_BASE_URL" >/dev/null; then
        printf '%s' ready
      else
        printf '%s' unavailable
      fi
    cwd: .
    timeout: 15
    check: true
    next: route_custom_base_url

  - switch: route_custom_base_url
    value: '{{output_value("validate_custom_base_url").stdout}}'
    cases:
      ready: backup_ollama_config_custom
    default: invalid_base_url

  - notify: invalid_base_url
    message: "Could not connect to a model. Check the URL and make sure the server is running with at least one downloaded chat model."
    next: explain_ollama

  - shell: backup_ollama_config_existing
    allowed_paths:
      - "~/.skiller"
    command: |
      set -eu
      {{runtime.python}} "{{flow.dir}}/ollama_auth.py" backup --run-id "{{flow.run_id}}"
    cwd: .
    timeout: 15
    check: true
    next: write_ollama_config_existing

  - shell: write_ollama_config_existing
    allowed_paths:
      - "~/.skiller"
    command: |
      set -eu
      base_url="http://127.0.0.1:11434"
      {{runtime.python}} "{{flow.dir}}/ollama_auth.py" configure "$base_url" --run-id "{{flow.run_id}}"
    cwd: .
    timeout: 15
    check: true
    next: verify_ollama

  - shell: backup_ollama_config_custom
    allowed_paths:
      - "~/.skiller"
    command: |
      set -eu
      {{runtime.python}} "{{flow.dir}}/ollama_auth.py" backup --run-id "{{flow.run_id}}"
    cwd: .
    timeout: 15
    check: true
    next: write_ollama_config_custom

  - shell: write_ollama_config_custom
    allowed_paths:
      - "~/.skiller"
    env:
      OLLAMA_BASE_URL: '{{output_value("ask_base_url").payload.text}}'
    command: |
      set -eu
      {{runtime.python}} "{{flow.dir}}/ollama_auth.py" configure "$OLLAMA_BASE_URL" --run-id "{{flow.run_id}}"
    cwd: .
    timeout: 15
    check: true
    next: verify_ollama

  # Ollama models are discovered at runtime. The configure step writes the
  # temporary selection to global agent.json, so this flow intentionally has no
  # package-local agent.json.
  - agent: verify_ollama
    system: |
      You are a configuration check agent.
      Reply with one short sentence.
    task: "Say that the Ollama agent configuration works."
    tools: []
    max_turns: 1
    next: route_ollama_validation

  - switch: route_ollama_validation
    value: '{{output_value("verify_ollama").data.stop_reason}}'
    cases:
      final: commit_ollama_config
    default: restore_failed_ollama_config

  - shell: commit_ollama_config
    allowed_paths:
      - "~/.skiller"
    command: |
      set -eu
      {{runtime.python}} "{{flow.dir}}/ollama_auth.py" commit --run-id "{{flow.run_id}}"
    cwd: .
    timeout: 15
    check: true
    next: done

  - shell: restore_failed_ollama_config
    allowed_paths:
      - "~/.skiller"
    command: |
      set -eu
      {{runtime.python}} "{{flow.dir}}/ollama_auth.py" restore --run-id "{{flow.run_id}}"
    cwd: .
    timeout: 15
    check: true
    next: validation_error

  - notify: validation_error
    format: markdown
    message: |
      Ollama returned installed models, but the agent request failed. The previous
      provider and model selection were restored.

      Choose an option:

      1. Try again
      2. Exit
    next: select_validation_action

  - wait_input: select_validation_action
    prompt: "Choose 1 to try again, or 2 to exit."
    next: route_validation_action

  - switch: route_validation_action
    value: '{{output_value("select_validation_action").payload.text}}'
    cases:
      "1": explain_ollama
      retry: explain_ollama
      Retry: explain_ollama
      try again: explain_ollama
      "2": exit_setup
      exit: exit_setup
      Exit: exit_setup
      quit: exit_setup
    default: invalid_validation_action

  - notify: invalid_validation_action
    message: "Invalid option. Type 1 to try again or 2 to exit."
    next: select_validation_action

  - notify: done
    message: "Ollama responded. Agent configuration is ready."

  - notify: exit_setup
    message: "Ollama connection canceled."
