name: auths/openai
description: "Configure any OpenAI-compatible provider credentials for Skiller agents"
version: "0.1"
start: check_provider_config

inputs:
  continue_id: string
  provider: string

on_success:
  cleanup: true
  action:
    type: post
    label: Auth success
    arg: load_session
    params: "run_id={{inputs.continue_id}}"
    auto: true

on_error:
  cleanup: true

steps:
  - shell: check_provider_config
    allowed_paths:
      - "~/.skiller"
    command: |
      set -eu

      provider='{{inputs.provider}}'
      secret_file="$({{runtime.python}} "{{flow.dir}}/openai_auth.py" api-key-file "$provider")"

      if [ -s "$secret_file" ]; then
        api_key="$(tr -d '[:space:]' < "$secret_file")"
        if [ "${#api_key}" -lt 20 ]; then
          printf '%s' invalid
          exit 0
        fi

        printf '%s' ready
        exit 0
      fi

      printf '%s' missing
    cwd: .
    timeout: 15
    check: true
    next: route_provider_config

  - switch: route_provider_config
    value: '{{output_value("check_provider_config").stdout}}'
    cases:
      ready: backup_provider_config
      invalid: clear_invalid_provider_secret
    default: explain_provider

  - notify: explain_provider
    format: markdown
    message: |
      # {{inputs.provider}} setup

      Paste your **{{inputs.provider}} API key** in the next prompt. Skiller will:

      1. Validate the key.
      2. Save it to `~/.skiller/secrets/{{inputs.provider}}_api_key`.
      3. Update the provider config and verify the connection.
    next: ask_api_key

  - wait_input: ask_api_key
    prompt: "Paste your {{inputs.provider}} API key"
    next: validate_api_key_shape

  - shell: validate_api_key_shape
    allowed_paths:
      - "~/.skiller"
    command: |
      set -eu

      api_key='{{output_value("ask_api_key").payload.text}}'
      api_key="$(printf '%s' "$api_key" | tr -d '[:space:]')"

      if [ "${#api_key}" -lt 20 ]; then
        printf '%s' invalid
        exit 0
      fi

      printf '%s' valid
    cwd: .
    timeout: 15
    check: true
    next: route_api_key_shape

  - switch: route_api_key_shape
    value: '{{output_value("validate_api_key_shape").stdout}}'
    cases:
      valid: write_provider_secret
    default: clear_invalid_provider_secret

  - shell: write_provider_secret
    allowed_paths:
      - "~/.skiller"
    command: |
      set -eu

      provider='{{inputs.provider}}'
      api_key='{{output_value("ask_api_key").payload.text}}'
      api_key="$(printf '%s' "$api_key" | tr -d '[:space:]')"
      if [ -z "$api_key" ]; then
        printf '%s\n' "{{inputs.provider}} API key is required." >&2
        exit 1
      fi

      secret_file="$({{runtime.python}} "{{flow.dir}}/openai_auth.py" api-key-file "$provider")"
      mkdir -p "$(dirname "$secret_file")"
      umask 077
      printf '%s\n' "$api_key" > "$secret_file"
      printf '%s' saved
    cwd: .
    timeout: 15
    check: true
    next: backup_provider_config

  - shell: clear_invalid_provider_secret
    allowed_paths:
      - "~/.skiller"
    command: |
      set -eu

      provider='{{inputs.provider}}'
      secret_file="$({{runtime.python}} "{{flow.dir}}/openai_auth.py" api-key-file "$provider")"
      rm -f "$secret_file"
      printf '%s' cleared
    cwd: .
    timeout: 15
    check: true
    next: invalid_api_key_shape

  - notify: invalid_api_key_shape
    message: "That does not look like a {{inputs.provider}} API key. Paste the full key."
    next: ask_api_key

  - shell: backup_provider_config
    allowed_paths:
      - "~/.skiller"
    command: |
      set -eu

      provider='{{inputs.provider}}'
      settings_dir="$HOME/.skiller/settings"
      config_file="$settings_dir/providers.json"
      backup_file="$settings_dir/providers.json.{{inputs.provider}}-auth.bak"
      missing_file="$settings_dir/providers.json.{{inputs.provider}}-auth.missing"

      mkdir -p "$(dirname "$config_file")" "$(dirname "$backup_file")"
      rm -f "$backup_file" "$missing_file"
      if [ -f "$config_file" ]; then
        cp "$config_file" "$backup_file"
      else
        printf '%s' missing > "$missing_file"
      fi

      printf '%s' backed-up
    cwd: .
    timeout: 15
    check: true
    next: write_provider_config

  - shell: write_provider_config
    allowed_paths:
      - "~/.skiller"
    command: |
      set -eu

      provider='{{inputs.provider}}'
      settings_dir="$HOME/.skiller/settings"
      config_file="$settings_dir/providers.json"
      secret_file="$({{runtime.python}} "{{flow.dir}}/openai_auth.py" api-key-file "$provider")"
      timeout_seconds="$({{runtime.python}} "{{flow.dir}}/openai_auth.py" timeout-seconds "$provider")"

      mkdir -p "$(dirname "$config_file")" "$(dirname "$secret_file")"

      if [ ! -s "$secret_file" ]; then
        printf '%s\n' "{{inputs.provider}} API key is required." >&2
        exit 1
      fi

      CONFIG_FILE="$config_file" SECRET_FILE="$secret_file" PROVIDER="$provider" TIMEOUT_SECONDS="$timeout_seconds" {{runtime.python}} - <<'PY'
      import json
      import os
      from pathlib import Path

      config_file = Path(os.environ["CONFIG_FILE"])
      secret_file = os.environ["SECRET_FILE"]
      provider = os.environ["PROVIDER"]
      timeout_seconds = int(os.environ["TIMEOUT_SECONDS"])
      if config_file.exists():
          config = json.loads(config_file.read_text(encoding="utf-8"))
      else:
          config = {}

      providers = config.setdefault("providers", {})
      if not isinstance(providers, dict):
          raise ValueError("Provider config providers must contain an object")
      provider_config = providers.setdefault(provider, {})
      if not isinstance(provider_config, dict):
          raise ValueError("Provider config must contain an object")
      provider_config.pop("model", None)
      provider_config["timeout_seconds"] = timeout_seconds
      provider_config["api_key_file"] = secret_file

      config_file.write_text(
          json.dumps(config, indent=2, sort_keys=True) + "\n",
          encoding="utf-8",
      )
      PY

      printf '%s\n' "{{inputs.provider}} provider config saved."
      printf '%s\n' "Provider config: $config_file"
      printf '%s\n' "Secret: $secret_file"
    cwd: .
    timeout: 15
    check: true
    next: prepare_verify_config

  - shell: prepare_verify_config
    command: |
      set -eu

      provider='{{inputs.provider}}'
      model="$({{runtime.python}} "{{flow.dir}}/openai_auth.py" default-model "$provider")"

      PROVIDER="$provider" MODEL="$model" CONFIG_FILE="{{flow.dir}}/agent.json" {{runtime.python}} - <<'PY'
      import json
      import os
      from pathlib import Path

      provider = os.environ["PROVIDER"]
      model = os.environ["MODEL"]
      config_file = Path(os.environ["CONFIG_FILE"])
      config_file.parent.mkdir(parents=True, exist_ok=True)
      config_file.write_text(
          json.dumps(
              {"llm": {"provider": provider, "model": model}},
              indent=2,
              sort_keys=True,
          )
          + "\n",
          encoding="utf-8",
      )
      PY

      printf '%s' prepared
    cwd: .
    timeout: 15
    check: true
    next: verify_provider

  - agent: verify_provider
    system: |
      You are a configuration check agent.
      Reply with one short sentence.
    task: "Say that the {{inputs.provider}} agent configuration works."
    tools: []
    max_turns: 1
    next: route_provider_validation

  - switch: route_provider_validation
    value: '{{output_value("verify_provider").data.stop_reason}}'
    cases:
      final: commit_provider_config
    default: restore_failed_provider_config

  - shell: commit_provider_config
    allowed_paths:
      - "~/.skiller"
    command: |
      set -eu

      settings_dir="$HOME/.skiller/settings"
      config_file="$settings_dir/agent.json"
      local_config_file="{{flow.dir}}/agent.json"

      CONFIG_FILE="$config_file" LOCAL_CONFIG_FILE="$local_config_file" {{runtime.python}} - <<'PY'
      import json
      import os
      from pathlib import Path

      config_file = Path(os.environ["CONFIG_FILE"])
      local_config_file = Path(os.environ["LOCAL_CONFIG_FILE"])
      local_config = json.loads(local_config_file.read_text(encoding="utf-8"))
      selection = local_config.get("llm")
      if not isinstance(selection, dict):
          raise ValueError("Auth agent config requires llm selection")

      provider = selection.get("provider")
      model = selection.get("model")
      if not isinstance(provider, str) or not provider.strip():
          raise ValueError("Auth agent config requires llm.provider")
      if not isinstance(model, str) or not model.strip():
          raise ValueError("Auth agent config requires llm.model")

      if config_file.exists():
          config = json.loads(config_file.read_text(encoding="utf-8"))
      else:
          config = {}
      if not isinstance(config, dict):
          raise ValueError("Global agent config must contain a JSON object")

      llm = config.setdefault("llm", {})
      if not isinstance(llm, dict):
          raise ValueError("Global agent config llm must contain an object")
      llm["provider"] = provider.strip()
      llm["model"] = model.strip()
      config_file.parent.mkdir(parents=True, exist_ok=True)
      config_file.write_text(
          json.dumps(config, indent=2, sort_keys=True) + "\n",
          encoding="utf-8",
      )
      PY

      rm -f "$HOME/.skiller/settings/providers.json.{{inputs.provider}}-auth.bak"
      rm -f "$HOME/.skiller/settings/providers.json.{{inputs.provider}}-auth.missing"
      printf '%s\n' "Global agent selection updated."
      printf '%s' committed
    cwd: .
    timeout: 15
    check: true
    next: done

  - shell: restore_failed_provider_config
    allowed_paths:
      - "~/.skiller"
    command: |
      set -eu

      provider='{{inputs.provider}}'
      settings_dir="$HOME/.skiller/settings"
      config_file="$settings_dir/providers.json"
      backup_file="$settings_dir/providers.json.{{inputs.provider}}-auth.bak"
      missing_file="$settings_dir/providers.json.{{inputs.provider}}-auth.missing"
      secret_file="$({{runtime.python}} "{{flow.dir}}/openai_auth.py" api-key-file "$provider")"

      if [ -f "$backup_file" ]; then
        cp "$backup_file" "$config_file"
      elif [ -f "$missing_file" ]; then
        rm -f "$config_file"
      fi

      rm -f "$backup_file" "$missing_file" "$secret_file"
      printf '%s' restored
    cwd: .
    timeout: 15
    check: true
    next: validation_error

  - notify: validation_error
    format: markdown
    message: |
      # {{inputs.provider}} validation failed

      The saved key was removed.

      ```text
      Choose an option:

      1. Paste a new {{inputs.provider}} API key
      2. Exit
      ```
    next: select_validation_action

  - wait_input: select_validation_action
    prompt: "Choose 1 to paste a new key, or 2 to exit."
    next: route_validation_action

  - switch: route_validation_action
    value: '{{output_value("select_validation_action").payload.text}}'
    cases:
      "1": ask_api_key
      retry: ask_api_key
      Retry: ask_api_key
      try again: ask_api_key
      "2": exit_setup
      exit: exit_setup
      Exit: exit_setup
      quit: exit_setup
    default: invalid_validation_action

  - notify: invalid_validation_action
    message: "Invalid option. Type 1 to paste a new {{inputs.provider}} API key or 2 to exit."
    next: select_validation_action

  - notify: done
    message: "{{inputs.provider}} responded. Agent configuration is ready."

  - notify: exit_setup
    message: "{{inputs.provider}} setup closed."
