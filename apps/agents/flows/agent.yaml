name: flows
description: "Agentic flow specialist for Skiller"
version: "0.1"
start: intro

inputs: {}

steps:
  - notify: intro
    message: "Flows helps you create, review, and fix agentic flows. Write a task to start."
    next: ask_user

  - wait_input: ask_user
    prompt: "Write a task"
    next: decide_exit

  - switch: decide_exit
    value: '{{output_value("ask_user").payload.text}}'
    cases:
      exit: done
      quit: done
      bye: done
    default: flows_agent

  - agent: flows_agent
    system:
      file: "./system.md"
    instructions:
      - "solve-task-style"
      - "create-flows"
      - "response-style"
    task: '{{output_value("ask_user").payload.text}}'
    tools:
      - shell
      - files
    max_turns: 50
    next: ask_user

  - notify: done
    message: "Flows agent closed."
