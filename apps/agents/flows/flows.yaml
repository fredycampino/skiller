name: flows
description: "Agentic flow specialist for Skiller"
version: "0.1"
start: intro

inputs: {}

steps:
  - notify: intro
    message: "Flows helps you create, review, and fix agentic flows. Write a task to start."
    next: ask_user

  - wait_input: ask_user
    prompt: "Write a task"
    next: flows_agent

  - agent: flows_agent
    config:
      file: "~/.skiller/settings/agent.flows.json"
    system:
      file: "./system.md"
    instructions:
      - "solve-task-style"
      - "create-flows"
      - "assistant-first-agent"
      - "response-style"
      - "code-style"
      - "skiller-permissions"
      - "skiller-user"
      - "ddgs-use"

    task: '{{output_value("ask_user").payload.text}}'
    tools:
      - shell
      - files
    max_turns: 50
    next: ask_user
