name: info/info
description: "First-use intro after LLM provider setup"
version: "0.1"
start: welcome

inputs: {}


steps:
  - notify: welcome
    format: markdown
    message: |
      # Skiller is ready

      Your LLM provider is configured.

      Starting the agentic flows workspace.

      You can also start it manually with:

      ```text
      /run flows
      ```
    action:
      type: run
      label: Start flows
      arg: flows
      auto: true
